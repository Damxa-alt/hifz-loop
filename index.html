<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12433F">
<title>Hifz Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#E8EDE9; --ink:#12302D; --muted:#5C706C;
  --line:#D5DEDA; --accent:#12433F; --accent-ink:#FFFFFF; --brass:#A57F35; --danger:#A33B2B;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0D1716; --surface:#15221F; --surface-2:#1C2C29; --ink:#E4ECE9; --muted:#95A9A4;
    --line:#2A3D39; --accent:#5FB3A6; --accent-ink:#0B1614; --brass:#D6B26A; --danger:#E27B69;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-top:4px}
h1{font-family:Newsreader,Georgia,serif;font-weight:600;font-size:1.75rem;margin:0;letter-spacing:-.01em}
.tag{font-size:.8rem;color:var(--muted)}
h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:600}
section{display:flex;flex-direction:column;gap:12px}

/* Now playing */
.player{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.np-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.np-surah{font-family:Newsreader,Georgia,serif;font-size:1.35rem;font-weight:600;line-height:1.2}
.np-ref{font-size:.85rem;opacity:.8;font-variant-numeric:tabular-nums}
.ayah-mark{flex:none;width:58px;height:58px;display:grid;place-items:center;position:relative;font-family:"Amiri Quran",serif;font-size:1.3rem}
.ayah-mark svg{position:absolute;inset:0;width:100%;height:100%}
.ayah-mark span{position:relative;padding-top:6px}
.arabic{font-family:"Amiri Quran","Amiri",serif;font-size:1.55rem;line-height:2.3;text-align:right;direction:rtl;min-height:2.3em;margin:0}
.arabic.dim{opacity:.55;font-size:1rem;font-family:Figtree,sans-serif;direction:ltr;text-align:left;line-height:1.5}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counter{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.counter b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;line-height:1.2}
.counter small{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.pips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pip{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.25}
.pip.on{opacity:1}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s}
.controls{display:flex;align-items:center;justify-content:center;gap:18px}
.ctl{appearance:none;border:0;background:rgba(255,255,255,.12);color:inherit;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ctl.big{width:72px;height:72px;background:var(--accent-ink);color:var(--accent)}
.ctl svg{width:24px;height:24px;fill:currentColor}
.ctl.big svg{width:30px;height:30px}
.ctl:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.status{font-size:.85rem;min-height:1.3em;text-align:center;opacity:.85}
.status.err{color:#FFD2C8;opacity:1}

/* Settings */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.range{display:grid;grid-template-columns:1fr auto;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.range:last-of-type{border-bottom:0;padding-bottom:0}
.range-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range-fields .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:500}
select,input[type=number]{
  font:inherit;font-size:1rem;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;min-width:0;font-variant-numeric:tabular-nums
}
.remove{align-self:start;margin-top:22px;appearance:none;border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:8px;cursor:pointer;font-size:1.3rem;line-height:1}
.remove:hover{color:var(--danger)}
.add{appearance:none;border:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-weight:600;border-radius:10px;padding:10px;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{appearance:none;border:0;background:none;color:var(--ink);font-size:1.3rem;width:44px;height:44px;cursor:pointer;flex:none}
.stepper input{border:0;background:none;text-align:center;padding:0;border-radius:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.summary{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.summary b{color:var(--ink)}
footer{font-size:.75rem;color:var(--muted);text-align:center}
footer a{color:inherit}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hifz Loop</h1>
    <span class="tag">Repeat to memorise</span>
  </header>

  <div class="player" aria-live="polite">
    <div class="np-top">
      <div>
        <div class="np-surah" id="npSurah">Al-Baqarah</div>
        <div class="np-ref" id="npRef">Ready · verses 10–25</div>
      </div>
      <div class="ayah-mark" aria-hidden="true">
        <svg viewBox="0 0 58 58"><g fill="none" stroke="currentColor" stroke-width="1.4" opacity=".7"><rect x="12" y="12" width="34" height="34" rx="3"/><rect x="12" y="12" width="34" height="34" rx="3" transform="rotate(45 29 29)"/><circle cx="29" cy="29" r="13"/></g></svg>
        <span id="npNum">١٠</span>
      </div>
    </div>
    <p class="arabic dim" id="npText">Press play to start.</p>
    <div class="counters">
      <div class="counter"><small>This verse</small><b id="cVerse">0 / 2</b><div class="pips" id="pips"></div></div>
      <div class="counter"><small>Whole range</small><b id="cRound">0 / 25</b></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="progress"></i></div>
    <div class="controls">
      <button class="ctl" id="btnPrev" aria-label="Previous verse"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ctl big" id="btnPlay" aria-label="Play"><svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="btnNext" aria-label="Next verse"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zM16 6h2v12h-2z"/></svg></button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <section>
    <h2>What to recite</h2>
    <div class="panel" id="ranges"></div>
    <button class="add" id="addRange">+ Add another range</button>
  </section>

  <section>
    <h2>Repeats</h2>
    <div class="panel">
      <div class="row2">
        <label for="perVerse">Each verse
          <div class="stepper"><button type="button" data-step="perVerse" data-d="-1" aria-label="Fewer">−</button><input type="number" id="perVerse" min="1" max="50" value="2" inputmode="numeric"><button type="button" data-step="perVerse" data-d="1" aria-label="More">+</button></div>
        </label>
        <label for="rounds">Whole range
          <div class="stepper"><button type="button" data-step="rounds" data-d="-1" aria-label="Fewer">−</button><input type="number" id="rounds" min="1" max="500" value="25" inputmode="numeric"><button type="button" data-step="rounds" data-d="1" aria-label="More">+</button></div>
        </label>
      </div>
      <div class="row2">
        <label for="gap">Pause between plays
          <select id="gap"><option value="0">None</option><option value="1" selected>1 second</option><option value="2">2 seconds</option><option value="3">3 seconds</option><option value="5">5 seconds</option></select>
        </label>
        <label for="reciter">Reciter
          <select id="reciter">
            <option value="Abdullah_Matroud_128kbps" selected>Abdullah Al-Matrood</option>
            <option value="Alafasy_128kbps">Mishary Alafasy</option>
            <option value="Husary_128kbps">Mahmoud Al-Husary</option>
            <option value="Abdurrahmaan_As-Sudais_192kbps">Abdurrahman As-Sudais</option>
            <option value="Abdul_Basit_Murattal_192kbps">Abdul Basit (Murattal)</option>
            <option value="MaherAlMuaiqly128kbps">Maher Al-Muaiqly</option>
            <option value="Minshawy_Murattal_128kbps">Al-Minshawi (Murattal)</option>
            <option value="Saood_ash-Shuraym_128kbps">Saud Ash-Shuraym</option>
          </select>
        </label>
      </div>
      <div class="summary" id="summary"></div>
    </div>
  </section>

  <footer>Audio streamed from <a href="https://everyayah.com" target="_blank" rel="noopener">everyayah.com</a> · text from <a href="https://alquran.cloud" target="_blank" rel="noopener">alquran.cloud</a></footer>
</div>

<audio id="audio" preload="auto"></audio>

<script>
const SURAHS = [
["Al-Fatihah",7],["Al-Baqarah",286],["Ali 'Imran",200],["An-Nisa",176],["Al-Ma'idah",120],["Al-An'am",165],["Al-A'raf",206],["Al-Anfal",75],["At-Tawbah",129],["Yunus",109],
["Hud",123],["Yusuf",111],["Ar-Ra'd",43],["Ibrahim",52],["Al-Hijr",99],["An-Nahl",128],["Al-Isra",111],["Al-Kahf",110],["Maryam",98],["Ta-Ha",135],
["Al-Anbiya",112],["Al-Hajj",78],["Al-Mu'minun",118],["An-Nur",64],["Al-Furqan",77],["Ash-Shu'ara",227],["An-Naml",93],["Al-Qasas",88],["Al-'Ankabut",69],["Ar-Rum",60],
["Luqman",34],["As-Sajdah",30],["Al-Ahzab",73],["Saba",54],["Fatir",45],["Ya-Sin",83],["As-Saffat",182],["Sad",88],["Az-Zumar",75],["Ghafir",85],
["Fussilat",54],["Ash-Shura",53],["Az-Zukhruf",89],["Ad-Dukhan",59],["Al-Jathiyah",37],["Al-Ahqaf",35],["Muhammad",38],["Al-Fath",29],["Al-Hujurat",18],["Qaf",45],
["Adh-Dhariyat",60],["At-Tur",49],["An-Najm",62],["Al-Qamar",55],["Ar-Rahman",78],["Al-Waqi'ah",96],["Al-Hadid",29],["Al-Mujadilah",22],["Al-Hashr",24],["Al-Mumtahanah",13],
["As-Saff",14],["Al-Jumu'ah",11],["Al-Munafiqun",11],["At-Taghabun",18],["At-Talaq",12],["At-Tahrim",12],["Al-Mulk",30],["Al-Qalam",52],["Al-Haqqah",52],["Al-Ma'arij",44],
["Nuh",28],["Al-Jinn",28],["Al-Muzzammil",20],["Al-Muddaththir",56],["Al-Qiyamah",40],["Al-Insan",31],["Al-Mursalat",50],["An-Naba",40],["An-Nazi'at",46],["'Abasa",42],
["At-Takwir",29],["Al-Infitar",19],["Al-Mutaffifin",36],["Al-Inshiqaq",25],["Al-Buruj",22],["At-Tariq",17],["Al-A'la",19],["Al-Ghashiyah",26],["Al-Fajr",30],["Al-Balad",20],
["Ash-Shams",15],["Al-Layl",21],["Ad-Duha",11],["Ash-Sharh",8],["At-Tin",8],["Al-'Alaq",19],["Al-Qadr",5],["Al-Bayyinah",8],["Az-Zalzalah",8],["Al-'Adiyat",11],
["Al-Qari'ah",11],["At-Takathur",8],["Al-'Asr",3],["Al-Humazah",9],["Al-Fil",5],["Quraysh",4],["Al-Ma'un",7],["Al-Kawthar",3],["Al-Kafirun",6],["An-Nasr",3],
["Al-Masad",5],["Al-Ikhlas",4],["Al-Falaq",5],["An-Nas",6]
];
const $ = id => document.getElementById(id);
const audio = $("audio");
const arNum = n => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);
const pad = (n, w=3) => String(n).padStart(w, "0");
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Settings UI ---------- */
let ranges = store.get("hl.ranges") || [{s:2, from:10, to:25}];
const surahOptions = SURAHS.map(([n,c],i)=>`<option value="${i+1}">${i+1}. ${n} (${c})</option>`).join("");

function renderRanges(){
  const box = $("ranges");
  box.innerHTML = "";
  ranges.forEach((r, idx) => {
    const el = document.createElement("div");
    el.className = "range";
    el.innerHTML = `
      <div class="range-fields">
        <label class="full" for="s${idx}">Surah<select id="s${idx}">${surahOptions}</select></label>
        <label for="f${idx}">From verse<input type="number" id="f${idx}" min="1" inputmode="numeric"></label>
        <label for="t${idx}">To verse<input type="number" id="t${idx}" min="1" inputmode="numeric"></label>
      </div>
      <button class="remove" aria-label="Remove range" ${ranges.length===1?"hidden":""}>×</button>`;
    box.appendChild(el);
    const sel = el.querySelector("select"), f = el.querySelector(`#f${idx}`), t = el.querySelector(`#t${idx}`);
    sel.value = r.s; f.value = r.from; t.value = r.to;
    f.max = t.max = SURAHS[r.s-1][1];
    sel.onchange = () => { r.s = +sel.value; r.from = 1; r.to = SURAHS[r.s-1][1]; renderRanges(); changed(); };
    f.onchange = () => { r.from = +f.value; fixRange(r); renderRanges(); changed(); };
    t.onchange = () => { r.to = +t.value; fixRange(r); renderRanges(); changed(); };
    el.querySelector(".remove").onclick = () => { ranges.splice(idx,1); renderRanges(); changed(); };
  });
}
function fixRange(r){
  const max = SURAHS[r.s-1][1];
  r.from = Math.min(Math.max(1, r.from||1), max);
  r.to = Math.min(Math.max(1, r.to||max), max);
  if (r.from > r.to) [r.from, r.to] = [r.to, r.from];
}
$("addRange").onclick = () => {
  const last = ranges[ranges.length-1];
  const s = Math.min(114, last.s + 1);
  ranges.push({s, from:1, to:SURAHS[s-1][1]});
  renderRanges(); changed();
};
document.querySelectorAll("[data-step]").forEach(b => b.onclick = () => {
  const inp = $(b.dataset.step);
  inp.value = Math.min(+inp.max, Math.max(+inp.min, (+inp.value||1) + +b.dataset.d));
  changed();
});
["perVerse","rounds","gap","reciter"].forEach(id => $(id).addEventListener("change", changed));

const saved = store.get("hl.opts");
if (saved){ for (const k of ["perVerse","rounds","gap","reciter"]) if (saved[k]!=null) $(k).value = saved[k]; }

function opts(){
  const clamp = (id) => { const i=$(id); const v=Math.min(+i.max, Math.max(1, Math.round(+i.value)||1)); i.value=v; return v; };
  return { perVerse: clamp("perVerse"), rounds: clamp("rounds"), gap: +$("gap").value, reciter: $("reciter").value };
}
function buildList(){
  const list = [];
  ranges.forEach(r => { for (let a=r.from; a<=r.to; a++) list.push({s:r.s, a}); });
  return list;
}
function changed(){
  const o = opts();
  store.set("hl.ranges", ranges); store.set("hl.opts", o);
  const list = buildList();
  const plays = list.length * o.perVerse * o.rounds;
  $("summary").innerHTML = `<b>${list.length}</b> verse${list.length===1?"":"s"} × <b>${o.perVerse}</b> each × <b>${o.rounds}</b> rounds = <b>${plays.toLocaleString()}</b> plays`;
  if (!playing && !started) resetState();
}

/* ---------- Playback ---------- */
let list = [], i = 0, rep = 0, round = 0, playing = false, started = false, gapTimer = null, textCache = {};
const O = () => opts();

function urlFor(v){ return `https://everyayah.com/data/${O().reciter}/${pad(v.s)}${pad(v.a)}.mp3`; }

function resetState(){
  list = buildList(); i = 0; rep = 0; round = 0; started = false;
  showVerse(false);
}
function showVerse(loadText=true){
  const o = O(), v = list[i]; if (!v) return;
  $("npSurah").textContent = SURAHS[v.s-1][0];
  $("npRef").textContent = started ? `Surah ${v.s}, verse ${v.a} · ${i+1} of ${list.length}` : `Ready · ${rangeLabel()}`;
  $("npNum").textContent = arNum(v.a);
  $("cVerse").textContent = `${started?rep+1:0} / ${o.perVerse}`;
  $("cRound").textContent = `${started?round+1:0} / ${o.rounds}`;
  $("pips").innerHTML = o.perVerse <= 20 ? Array.from({length:o.perVerse},(_,k)=>`<span class="pip ${started&&k<=rep?"on":""}"></span>`).join("") : "";
  const total = list.length * o.perVerse * o.rounds;
  const done = ((round*list.length + i) * o.perVerse + rep);
  $("progress").style.width = started ? `${(done/total*100).toFixed(2)}%` : "0";
  if (loadText) loadAyahText(v); else { const t=$("npText"); t.className="arabic dim"; t.textContent="Press play to start."; }
  if ("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: `${SURAHS[v.s-1][0]} ${v.s}:${v.a}`,
      artist: $("reciter").selectedOptions[0].textContent,
      album: `Round ${round+1} of ${o.rounds} · repeat ${rep+1} of ${o.perVerse}`
    });
  }
}
function rangeLabel(){
  return ranges.map(r => ranges.length===1 ? `verses ${r.from}–${r.to}` : `${r.s}:${r.from}–${r.to}`).join(", ");
}
async function loadAyahText(v){
  const key = `${v.s}:${v.a}`, t = $("npText");
  if (textCache[key]){ t.className="arabic"; t.textContent=textCache[key]; return; }
  t.className="arabic dim"; t.textContent="";
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/ayah/${key}/quran-uthmani`);
    const j = await res.json();
    let txt = j.data.text;
    if (v.a===1 && v.s!==1 && v.s!==9) txt = txt.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/,"");
    textCache[key] = txt;
    const cur = list[i]; if (cur && cur.s===v.s && cur.a===v.a){ t.className="arabic"; t.textContent=txt; }
  }catch(e){ t.className="arabic dim"; t.textContent=""; }
  prefetchText();
}
function prefetchText(){
  const n = list[i+1]; if (!n) return;
  const key = `${n.s}:${n.a}`; if (textCache[key]) return;
  fetch(`https://api.alquran.cloud/v1/ayah/${key}/quran-uthmani`).then(r=>r.json()).then(j=>{
    let txt=j.data.text; if (n.a===1 && n.s!==1 && n.s!==9) txt=txt.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/,"");
    textCache[key]=txt;
  }).catch(()=>{});
}
let preloader = null;
function prefetchAudio(){
  const n = list[(i+1) % list.length]; if (!n) return;
  preloader = new Audio(); preloader.preload = "auto"; preloader.src = urlFor(n);
}
function loadAndPlay(){
  const v = list[i];
  const src = urlFor(v);
  setStatus("");
  if (audio.src !== src){ audio.src = src; }
  else { audio.currentTime = 0; }
  showVerse(true);
  audio.play().catch(err => { if (err.name !== "AbortError") { setStatus("Tap play to continue.", false); setPlaying(false); } });
  if (rep === 0) prefetchAudio();
}
function advance(){
  const o = O();
  rep++;
  if (rep >= o.perVerse){
    rep = 0; i++;
    if (i >= list.length){
      i = 0; round++;
      if (round >= o.rounds){
        finish(); return;
      }
    }
  }
  loadAndPlay();
}
function finish(){
  setPlaying(false); started = false;
  const o = O();
  $("progress").style.width = "100%";
  $("cRound").textContent = `${o.rounds} / ${o.rounds}`;
  setStatus(`Done — ${rangeLabel()} completed ${o.rounds} times. بارك الله فيك`, false);
  i = 0; rep = 0; round = 0;
}
audio.addEventListener("ended", () => {
  if (!playing) return;
  const g = O().gap;
  if (g > 0){ gapTimer = setTimeout(advance, g*1000); } else advance();
});
audio.addEventListener("error", () => {
  if (!playing) return;
  const v = list[i];
  setStatus(`Couldn't load ${v.s}:${v.a}. Check your connection, then press play.`, true);
  setPlaying(false);
});
audio.addEventListener("waiting", () => { if (playing) setStatus("Loading…"); });
audio.addEventListener("playing", () => setStatus(""));

function setStatus(msg, err=false){ const s=$("status"); s.textContent=msg; s.className = "status" + (err?" err":""); }
function setPlaying(p){
  playing = p;
  $("btnPlay").setAttribute("aria-label", p ? "Pause" : "Play");
  $("playIcon").innerHTML = p ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  if ("mediaSession" in navigator) navigator.mediaSession.playbackState = p ? "playing" : "paused";
  if (p) requestWake(); else releaseWake();
}
function play(){
  if (!started){ list = buildList(); if (!list.length) return; i = 0; rep = 0; round = 0; started = true; setPlaying(true); loadAndPlay(); return; }
  setPlaying(true);
  if (audio.ended || !audio.src) loadAndPlay();
  else audio.play().catch(()=>setPlaying(false));
}
function pause(){ clearTimeout(gapTimer); audio.pause(); setPlaying(false); }
function jump(d){
  if (!started){ list = buildList(); started = true; }
  clearTimeout(gapTimer);
  i = (i + d + list.length) % list.length; rep = 0;
  if (playing) loadAndPlay(); else { audio.src = urlFor(list[i]); showVerse(true); }
}
$("btnPlay").onclick = () => playing ? pause() : play();
$("btnPrev").onclick = () => jump(-1);
$("btnNext").onclick = () => jump(1);
if ("mediaSession" in navigator){
  const ms = navigator.mediaSession;
  try{
    ms.setActionHandler("play", play);
    ms.setActionHandler("pause", pause);
    ms.setActionHandler("previoustrack", () => jump(-1));
    ms.setActionHandler("nexttrack", () => jump(1));
  }catch(e){}
}

/* Keep screen awake while playing (optional) */
let wake = null;
async function requestWake(){ try{ if ("wakeLock" in navigator && !wake) wake = await navigator.wakeLock.request("screen"); wake && wake.addEventListener("release", ()=>wake=null); }catch(e){} }
function releaseWake(){ try{ wake && wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if (document.visibilityState==="visible" && playing) requestWake(); });

renderRanges();
changed();
</script>
</body>
